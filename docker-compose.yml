

services:

  web:
    build: .
    container_name: zenvy-web

    ports:
      - "8081:80"

    depends_on:
      - db

  db:
    image: mysql:8.0

    container_name: zenvy-db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vente_db

    ports:
      - "3309:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: